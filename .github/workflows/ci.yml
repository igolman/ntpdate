---
name: 'CI'
"on":
  pull_request:
  push:
    branches:
      - master
      - 'feature/**'

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Run yaml Lint
        uses: actionshub/yamllint@main

  mdl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Run Markdown Lint
        uses: actionshub/markdownlint@main

  cookstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Install Chef
        uses: actionshub/chef-install@main
        env:
          CHEF_LICENSE: accept-no-persis
      - name: Run Cookstyle
        run: chef exec cookstyle -D -E -f github
        env:
          CHEF_LICENSE: accept-no-persist
      # - name: Upload cookstyle results
      #   uses: actions/upload-artifact@v3
      #  if: success() || failure()
      #  with:
      #    name: cookstyle-results
      #    path: cookstyle.xml

  kitchen:
    runs-on: ubuntu-latest
    needs:
      - yamllint
      - mdl
      - cookstyle
    strategy:
      matrix:
        os:
          - ubuntu-1804
          - ubuntu-2004
          - ubuntu-2204
          - ubuntu-2404
          - ubuntu-2604
        suite:
          - default-chef18
          - default-chef19
          - custom-chef18
          - custom-chef19
          - disabled-chef18
          - disabled-chef19
        exclude:
          - os: ubuntu-1804
            suite: default-chef19
          - os: ubuntu-1804
            suite: custom-chef19
          - os: ubuntu-1804
            suite: disabled-chef19
          - os: ubuntu-2004
            suite: default-chef19
          - os: ubuntu-2004
            suite: custom-chef19
          - os: ubuntu-2004
            suite: disabled-chef19
          - os: ubuntu-2204
            suite: default-chef19
          - os: ubuntu-2204
            suite: custom-chef19
          - os: ubuntu-2204
            suite: disabled-chef19
          - os: ubuntu-2404
            suite: default-chef19
          - os: ubuntu-2404
            suite: custom-chef19
          - os: ubuntu-2404
            suite: disabled-chef19
          - os: ubuntu-2604
            suite: default-chef18
          - os: ubuntu-2604
            suite: custom-chef18
          - os: ubuntu-2604
            suite: disabled-chef18
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Install Chef
        uses: actionshub/chef-install@main
      - name: Kitchen Tests
        uses: actionshub/test-kitchen@main
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: .kitchen.yml
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
      - name: Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: kitchen-results
          path: kitchen-reports/*.xml
          if-no-files-found: error
